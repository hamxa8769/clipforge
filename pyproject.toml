[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.4.0"
description = "AI short-form clipping + per-platform SEO + approval-first publishing for YouTube, Facebook, Instagram and TikTok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hamxa8769" }]
keywords = ["video", "shorts", "clipping", "seo", "youtube", "tiktok", "instagram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Encrypted token/credential storage (clipforge.auth): Fernet file
    # fallback when no OS keyring backend is available.
    "cryptography>=42",
    # OS keyring (Credential Manager / Keychain / Secret Service) for
    # secrets; optional at runtime — import failure falls back to the
    # encrypted file, so the server never fails to start without it.
    "keyring>=25",
]

[project.optional-dependencies]
# Local transcription (Whisper). Heavy download (~500 MB+ models); only
# install on a worker that actually transcribes. Cloud Whisper API needs no
# extra package — it uses httpx via the OPENAI_API_KEY.
transcribe = ["faster-whisper>=1.0"]
# Face/person tracking for 9:16 reframe. Headless build: no GUI deps.
vision = ["opencv-python-headless>=4.10"]
# YouTube Data API v3 client (used by the YouTube publishing adapter).
youtube = ["google-api-python-client>=2.140"]
# Everything needed to run the test suite + linting.
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",  # FastAPI TestClient transport
]
# Build the packaged `clipforge-server` executable (see
# scripts/build_exe.py and clipforge-server.spec).
packaging = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/hamxa8769/clipforge"
Repository = "https://github.com/hamxa8769/clipforge"
Issues = "https://github.com/hamxa8769/clipforge/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# app.py bootstraps sys.path before importing clipforge (needed when
# uvicorn is launched from apps/api, the repo root, or anywhere else).
"apps/api/clipforge_api/app.py" = ["E402"]
# PyInstaller spec: Analysis/PYZ/EXE are globals injected by the build,
# and the coding header is PyInstaller's own template convention.
"clipforge-server.spec" = ["F821", "I001", "UP009"]

[tool.ruff.format]
# line-length is inherited from [tool.ruff] above.

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
