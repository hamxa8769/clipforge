# ClipForge Release — packaged executables
#
# Trigger: a `v*` tag push (e.g. v0.1.0) or manual dispatch.
# Builds the one-file `clipforge-server` executable + the Next.js web UI
# on windows-latest AND ubuntu-latest (an executable only runs on the
# platform it was built on — the Windows .exe is NEVER built on Linux).
# The two zips are attached to the GitHub Release for the tag.
#
# The release job only runs for tag pushes; a manual dispatch just
# produces the zips as workflow artifacts (no Release is created).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable + web UI
        run: python scripts/build_exe.py --with-web

      - name: Smoke-test the exe
        run: |
          $exe = (Get-ChildItem dist/stage/*/clipforge-server.exe).FullName
          python scripts/smoke_exe.py $exe

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows
          path: dist/ClipForge-*-Windows.zip
          if-no-files-found: error

  build-linux:
    name: Linux executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable + web UI
        run: python scripts/build_exe.py --with-web

      - name: Smoke-test the binary
        run: python scripts/smoke_exe.py dist/stage/*/clipforge-server

      - name: Upload Linux zip
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Linux
          path: dist/ClipForge-*-Linux.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    # Only for tag pushes — manual dispatch produces artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: ClipForge-Windows
          path: release-assets

      - name: Download Linux zip
        uses: actions/download-artifact@v4
        with:
          name: ClipForge-Linux
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/ClipForge-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
