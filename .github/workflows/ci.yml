# ClipForge CI — v0.1.0
#
# Python job: ruff (lint + format check) and pytest on every push/PR.
# Web job: Next.js build — runs when apps/web has real app source
# (an app/ or pages/ dir, or a next.config.*); the hashFiles gate below
# activates it automatically.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (smoke test + pipeline dependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install ClipForge + dev tools
        # Editable install needs the src/clipforge package to exist; until
        # the implementation modules land it may install an empty package,
        # so fall back to installing the dev tools directly.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install pytest ruff mypy fastapi uvicorn sqlalchemy pydantic pydantic-settings httpx python-multipart

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest tests/ -q

  web:
    name: Web (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  rust:
    name: Rust (cargo test, Windows)
    # The desktop crate cannot link on Linux (needs WebKitGTK), so the
    # Rust tests only run on Windows — which is also the platform the
    # startup-health fix is for. WebView2 is preinstalled on
    # windows-latest, so no extra system setup is needed.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      # tauri-build validates that the externalBin sidecar exists before
      # it compiles anything, so `cargo test` needs the staged path to
      # exist even though no test runs the server. A placeholder is
      # enough — the tests only read sources and spin up TCP listeners.
      # (The release workflow stages the real server exe instead.)
      - name: Stage placeholder sidecar for tauri-build
        run: |
          New-Item -ItemType Directory -Force -Path binaries | Out-Null
          New-Item -ItemType File -Force -Path binaries/clipforge-server-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Cargo test
        run: cargo test
