[package]
name = "clipforge-desktop"
version = "0.9.3"
description = "ClipForge desktop shell (Tauri v2) — launches and manages the clipforge-server sidecar, no terminal window."
authors = ["ClipForge"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Objects (kill the whole sidecar process tree when the shell exits)
# + OpenProcess/WaitForSingleObject (wait until a pid is really gone).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
lto = true
codegen-units = 1
